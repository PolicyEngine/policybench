name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request supersedes the run on its previous head, so
# cancel that run instead of letting it wait for, then hold, runners the whole
# PolicyEngine org shares (60 concurrent jobs on the GitHub Team plan). Pushes
# to main get a group of their own per run, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    # Serially, the test job on main took 29.5 minutes at b0c8f2e and hit
    # this limit at ec5413c (2026-11-02). In parallel it took 12.3 and 15.7
    # minutes with -n logical (4 workers, runs 41526298328 and 41529016470),
    # and 12.5 to 16.2 minutes in three attempts with -n auto (run
    # 41490222217). Fail a hung job instead of holding a shared runner for
    # GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # The release gates read the September 22c base files from git
          # (scripts/finish_adds0928.py BASE_COMMIT), so fetch full history.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --locked --extra dev
      # One worker per logical CPU (-n auto would count physical cores, since
      # psutil is installed); the "created: N/N workers" line gives the count.
      # --dist loadfile keeps each test file on one worker; on a 4-vCPU VM it
      # ran faster than --dist load (9.2 to 9.7 minutes, against 10.1).
      - run: uv run pytest -m "not slow" -n logical --dist loadfile --tb=short

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Tests read the bundled live summary and the tracked serving-config copy,
      # which prepare-data generates and refreshes; the build runs it again from cache.
      - run: bun run prepare-data
      - run: bun test tests
      - run: bun run build
