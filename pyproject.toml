[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policybench"
version = "2.0.0"
description = "Benchmark: can AI models calculate tax/benefit outcomes without tools?"
readme = "README.md"
license = "Unlicense"
authors = [{name = "PolicyEngine", email = "hello@policyengine.org"}]
requires-python = ">=3.11"
dependencies = [
    "litellm[caching]>=1.30",
    "pandas>=2.0",
    "numpy>=1.25",  # Generator.spawn (policybench.uk_audit)
    "policyengine==6.1.2",
    "policyengine-us==2.41.0",
    "policyengine-uk==2.126.7",
    "anthropic>=0.115.1",
    "google-genai>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# The paper render environment (paper/render_paper.py, .github/workflows/paper.yml):
# the Jupyter kernel and notebook runner that Quarto's Jupyter engine drives.
# jupyter-book, which builds the docs/ site, stays out of uv.lock on purpose:
# docs/requirements.txt declares it (README.md, "Paper and documentation site").
docs = [
    "ipykernel>=6.0",
    "nbformat>=5.0",
    "nbclient>=0.10",
]

[project.scripts]
policybench = "policybench.cli:main"

[tool.setuptools.packages.find]
include = ["policybench*"]

[tool.setuptools.package-data]
policybench = ["benchmark_specs.json", "population_weights.json", "uk_audit_councils.csv"]

[tool.ruff]
line-length = 88
target-version = "py311"
# reference_audit/ holds byte-exact records of the audit's sandbox modules: the
# reference sidecar pins their sha256, so they are never reformatted.
# docs/adds0928/review_evidence/ keeps a review's probe scripts as they ran, and
# docs/judge_isolation_2026-09-30/ the judge-isolation audit's scripts.
extend-exclude = [
    "app/public/paper/web/index.out.ipynb",
    "reference_audit",
    "docs/adds0928/review_evidence",
    "docs/judge_isolation_2026-09-30",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
